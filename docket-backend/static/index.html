<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocFlow: Digital Document Approval Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9; --warm:#F8F0E8; --surface:#FFFFFF; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --navy:#0F1A2B; --navy-2:#1C2B44; --navy-ink:#E6EBF3; --navy-muted:#93A1B8;
  --primary:#111C2E; --primary-ink:#FFFFFF;
  --ai:#5B4FD6; --ai-soft:#EEEBFD;
  --green:#16A34A; --green-soft:#E3F6EA; --on-green:#FFFFFF;
  --amber:#B45309; --amber-soft:#FEF3DC;
  --red:#DC2626; --red-soft:#FDE8E8; --on-red:#FFFFFF;
  --blue:#2563EB; --blue-soft:#E4EDFD;
  --focus:#2F6FDB; --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B111B; --warm:#10161F; --surface:#151D2A; --ink:#E8EDF4; --muted:#93A0B3; --line:#263245;
    --navy:#070B12; --navy-2:#18233A; --navy-ink:#E6EBF3; --navy-muted:#8B98AD;
    --primary:#E8EDF4; --primary-ink:#0B111B;
    --ai:#A59CF7; --ai-soft:#221F45;
    --green:#4ADE80; --green-soft:#12301F; --on-green:#052E16;
    --amber:#FBBF24; --amber-soft:#35290D;
    --red:#F87171; --red-soft:#3A1818; --on-red:#3B0A0A;
    --blue:#7BA7F8; --blue-soft:#15264A; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0B111B; --warm:#10161F; --surface:#151D2A; --ink:#E8EDF4; --muted:#93A0B3; --line:#263245;
  --navy:#070B12; --navy-2:#18233A; --navy-ink:#E6EBF3; --navy-muted:#8B98AD;
  --primary:#E8EDF4; --primary-ink:#0B111B;
  --ai:#A59CF7; --ai-soft:#221F45;
  --green:#4ADE80; --green-soft:#12301F; --on-green:#052E16;
  --amber:#FBBF24; --amber-soft:#35290D;
  --red:#F87171; --red-soft:#3A1818; --on-red:#3B0A0A;
  --blue:#7BA7F8; --blue-soft:#15264A; --focus:#7FB0FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1rem;font-weight:600}
h3{font-size:.92rem;font-weight:600}
h1:focus{outline:none}
p{margin:0 0 .75rem}
small,.muted{color:var(--muted)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{width:1.15em;height:1.15em;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;font-weight:600;font-size:.88rem;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:.3rem .75rem;font-size:.8rem}
.btn.wide{width:100%}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.green{background:var(--green);color:var(--on-green);border-color:var(--green)}
.btn.red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
label.f{display:block;font-weight:600;font-size:.82rem;margin-bottom:1rem}
.f input,.f textarea,.f select{display:block;width:100%;margin-top:.35rem;font:inherit;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem}
.f input::placeholder,.f textarea::placeholder{color:var(--muted)}
.f textarea{resize:vertical}
.f .hint{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:.3rem}
.pw{position:relative}
.pw button{position:absolute;right:.4rem;bottom:.35rem;background:none;border:0;color:var(--muted);padding:.3rem;cursor:pointer;border-radius:6px}
.pw input{padding-right:2.4rem}
.error{color:var(--red);font-weight:600;font-size:.85rem;margin:0 0 .75rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.25rem}
.card + .card{margin-top:1rem}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.12rem .65rem;font-size:.78rem;font-weight:600;background:var(--soft,var(--bg));color:var(--c,var(--muted));white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-approved{--c:var(--green);--soft:var(--green-soft)}
.s-submitted{--c:var(--amber);--soft:var(--amber-soft)}
.s-rejected{--c:var(--red);--soft:var(--red-soft)}
.s-draft{--c:var(--muted);--soft:var(--line)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:0 .4rem;border-radius:4px;background:var(--red-soft);color:var(--red)}

/* logged-out pages */
.warm{min-height:100dvh;background:linear-gradient(160deg,var(--warm),var(--bg))}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.1rem}
.brand .ic{width:1.3rem;height:1.3rem}
.lnav{max-width:1100px;margin:0 auto;padding:1rem;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.lnav .links{margin-left:auto;display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
.lnav .links button.plain{background:none;border:0;color:var(--ink);font-size:.85rem;cursor:pointer;padding:.25rem}
.hero{max-width:1100px;margin:0 auto;padding:2.5rem 1rem 3rem;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2rem;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin-bottom:1.25rem}
.steps-row{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:1.05rem;font-weight:600;margin-bottom:1rem}
.steps-row span+span::before{content:"\2022";margin-right:1rem;color:var(--muted)}
.hero p.lead{color:var(--muted);max-width:42ch;margin-bottom:1.5rem}
.hero .actions{display:flex;gap:.6rem;flex-wrap:wrap}
.art{position:relative;max-width:440px;margin-left:auto;width:100%}
.art svg{width:100%;height:auto;display:block}
.aichip{position:absolute;top:6%;right:0;display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--ai);border-radius:8px;padding:.45rem .7rem;font-size:.72rem;font-weight:600;line-height:1.2;color:var(--ink);box-shadow:0 6px 20px rgba(17,28,46,.12)}
.aichip .ic{color:var(--ai);width:1.4rem;height:1.4rem}
.strip{max-width:1100px;margin:0 auto;padding:0 1rem}
.strip .in{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.25rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.feat{display:flex;gap:.75rem;align-items:flex-start}
.feat .ic{width:1.5rem;height:1.5rem;margin-top:.15rem}
.feat strong{display:block;font-size:.85rem}
.feat small{font-size:.78rem}
.how{max-width:1100px;margin:0 auto;padding:3rem 1rem 4rem}
.how h2{font-size:1.4rem;margin-bottom:1.25rem}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;counter-reset:s}
.how li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem}
.how li::before{content:counter(s);display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:.8rem;margin-bottom:.6rem}
.how li strong{display:block;margin-bottom:.2rem}
.authwrap{min-height:100dvh;display:grid;place-items:center;padding:2rem 1rem;background:linear-gradient(160deg,var(--warm),var(--bg))}
.authbox{width:100%;max-width:400px}
.authbox .brand{justify-content:center;margin-bottom:1.25rem}
.authbox .card{padding:1.75rem}
.authbox h1{text-align:center;font-size:1.3rem;margin-bottom:.25rem}
.authbox .sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
.authbox .alt{text-align:center;margin:1.1rem 0 0;font-size:.85rem;color:var(--muted)}
.demo{margin-top:1rem;text-align:center;font-size:.8rem;color:var(--muted)}
.demo .row{display:flex;gap:.5rem;justify-content:center;margin-top:.4rem;flex-wrap:wrap}
@media (max-width:820px){.hero{grid-template-columns:1fr}.art{margin:0 auto}}

/* app shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100dvh}
.side{background:var(--navy);color:var(--navy-ink);padding:1.1rem .75rem;display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));align-self:start}
.side .brand{padding:0 .4rem;color:#fff}
.me{display:flex;align-items:center;gap:.6rem;padding:.5rem .4rem}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy-ink);color:var(--navy);font-weight:700;flex:none}
.av.sm{width:30px;height:30px;background:var(--primary);color:var(--primary-ink);font-size:.85rem}
.me strong{display:block;font-size:.85rem;color:#fff}
.me small{color:var(--navy-muted);font-size:.75rem}
.side nav{display:flex;flex-direction:column;gap:.15rem;flex:1}
.nav{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;background:none;border:0;color:var(--navy-muted);font-size:.86rem;font-weight:500;padding:.55rem .7rem;border-radius:8px;cursor:pointer}
.nav:hover{color:#fff;background:var(--navy-2)}
.nav[aria-current="page"]{background:var(--navy-2);color:#fff}
.nav.out{flex:none}
.content{min-width:0}
.topbar{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.topbar form{flex:1;max-width:420px;position:relative}
.topbar form .ic{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.topbar input{width:100%;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .75rem .5rem 2.2rem;color:var(--ink)}
.topbar .sp{flex:1}
.iconbtn{background:none;border:0;color:var(--muted);padding:.4rem;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.page{padding:1.5rem;max-width:1100px}
.pagehead{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem}
.pagehead p{margin:.2rem 0 0;color:var(--muted)}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:.5rem;overflow-x:auto;padding:.5rem;z-index:6}
  .side .me{display:none}
  .side nav{flex-direction:row;flex:none}
  .nav{width:auto;white-space:nowrap}
  .topbar{top:auto;position:static;padding:.6rem 1rem}
  .page{padding:1rem}
}

/* stats + tables */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{display:flex;align-items:center;gap:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}
.stat .ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--c);flex:none}
.stat .ico .ic{width:1.3rem;height:1.3rem}
.stat small{display:block;font-size:.78rem}
.stat b{font-size:1.5rem;font-weight:700;line-height:1.1}
.stat.blue{--c:var(--blue);--soft:var(--blue-soft)}
.stat.amber{--c:var(--amber);--soft:var(--amber-soft)}
.stat.green{--c:var(--green);--soft:var(--green-soft)}
.stat.red{--c:var(--red);--soft:var(--red-soft)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.76rem;font-weight:600;color:var(--muted);padding:.7rem 1rem;background:var(--bg);white-space:nowrap}
td{padding:.75rem 1rem;border-top:1px solid var(--line);vertical-align:middle}
td small{display:block;font-size:.76rem}
th.r,td.r{text-align:right}
td .acts{display:inline-flex;gap:.4rem}
.docid{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.empty{text-align:center;padding:2.5rem 1rem;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.fchip{font-size:.82rem;font-weight:500;padding:.25rem .8rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.fchip[aria-pressed=true]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

/* upload */
.upgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:1rem;align-items:start}
@media (max-width:860px){.upgrid{grid-template-columns:1fr}}
.back{display:inline-flex;align-items:center;gap:.4rem;background:none;border:0;color:var(--muted);font-weight:500;cursor:pointer;padding:0;margin-bottom:1rem}
.back:hover{color:var(--ink)}
.drop{position:relative;border:1.5px dashed var(--muted);border-radius:var(--radius);padding:2rem 1rem;text-align:center;margin-bottom:1rem;background:var(--bg)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.drop .ic{width:1.8rem;height:1.8rem;color:var(--muted)}
.drop b{display:block;margin-top:.4rem}
.drop:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.switchrow{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;font-weight:600;font-size:.85rem}
.switch{position:relative;width:38px;height:22px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true]{background:var(--blue)}
.switch[aria-checked=true]::after{transform:translateX(16px)}
.newbadge{font-size:.65rem;font-weight:700;background:var(--green-soft);color:var(--green);border-radius:4px;padding:0 .35rem;margin-left:.3rem}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}

/* detail */
.dochead{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between}
.dochead .l{display:flex;gap:.9rem;align-items:center;min-width:0}
.fileico{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--green-soft);color:var(--green);flex:none}
.fileico .ic{width:1.4rem;height:1.4rem}
.dochead h1{font-size:1.15rem;overflow-wrap:anywhere}
.dochead .meta{color:var(--muted);font-size:.82rem;display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:center;margin-top:.15rem}
.dochead .r{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tabs2{display:flex;gap:1.25rem;border-bottom:1px solid var(--line);margin:1rem 0}
.tab2{background:none;border:0;border-bottom:2px solid transparent;padding:.55rem .1rem;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab2[aria-selected=true]{color:var(--ai);border-bottom-color:var(--ai)}
.aigrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem}
@media (max-width:860px){.aigrid{grid-template-columns:1fr}}
.aihead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.9rem;flex-wrap:wrap}
.aihead h2{display:flex;align-items:center;gap:.5rem;color:var(--ai)}
.badge{font-size:.72rem;font-weight:600;padding:.12rem .6rem;border-radius:99px}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.demo{background:var(--ai-soft);color:var(--ai)}
.sum{background:var(--ai-soft);border:1px solid var(--ai);border-radius:var(--radius);padding:.9rem 1rem;margin-bottom:1rem}
.sum h3{color:var(--ai);display:flex;align-items:center;gap:.4rem;margin-bottom:.4rem}
.sum p{margin:0;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;margin:0}
.kv dt{color:var(--muted);font-size:.82rem}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.compl{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.ring{width:84px;height:84px;flex:none;color:var(--ink)}
.attn{border-radius:var(--radius);padding:.9rem 1rem;background:var(--amber-soft);border:1px solid var(--amber)}
.attn.good{background:var(--green-soft);border-color:var(--green)}
.attn h3{display:flex;align-items:center;gap:.4rem;color:var(--amber);margin-bottom:.4rem}
.attn.good h3{color:var(--green)}
.attn p{font-size:.85rem}
.attn ul{margin:.4rem 0 0;padding-left:1.1rem;font-size:.85rem}
.foot-note{margin-top:1rem;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.timeline{list-style:none;margin:0;padding:0 0 0 .5rem}
.timeline li{position:relative;padding:0 0 1.25rem 1.5rem;border-left:2px solid var(--line);margin-left:.35rem}
.timeline li:last-child{padding-bottom:0;border-left-color:transparent}
.timeline li::before{content:"";position:absolute;left:-7px;top:.2rem;width:12px;height:12px;border-radius:50%;background:var(--c,var(--muted));border:2px solid var(--surface)}
.timeline li[data-s=submitted]{--c:var(--amber)}
.timeline li[data-s=approved]{--c:var(--green)}
.timeline li[data-s=rejected]{--c:var(--red)}
.timeline small{display:block}
.timeline p{margin:.3rem 0 0;font-size:.88rem}
.quote{border-left:3px solid var(--ai);padding-left:.8rem;margin:.4rem 0 .6rem}
.actionbar{position:sticky;bottom:calc(.75rem + env(safe-area-inset-bottom,0px));margin-top:1.25rem;box-shadow:0 8px 24px rgba(17,28,46,.14)}
.actionbar .row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.hist-card .top{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.hist-card .top .l{display:flex;gap:.8rem;align-items:center}

/* viewer */
.vbar{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.6rem 1rem;background:var(--navy);color:#fff;border-radius:var(--radius) var(--radius) 0 0}
.vbar .name{font-weight:600;flex:1;min-width:8rem;overflow-wrap:anywhere}
.vbar button{background:none;border:1px solid #ffffff44;color:#fff;border-radius:6px;padding:.2rem .6rem;cursor:pointer;font-weight:600}
.vbar button:hover{background:#ffffff22}
.vbody{display:grid;grid-template-columns:110px minmax(0,1fr);background:var(--bg);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);min-height:420px}
.vbody.solo{grid-template-columns:1fr}
.thumbs{padding:.75rem;display:flex;flex-direction:column;gap:.75rem;align-items:center;border-right:1px solid var(--line);background:var(--surface)}
.thumb{width:72px;height:92px;border:2px solid var(--line);border-radius:4px;background:#fff;color:#111;cursor:pointer;padding:6px;font-size:.6rem;text-align:left;overflow:hidden}
.thumb[aria-current=true]{border-color:var(--blue)}
.thumb i{display:block;height:3px;background:#cfd6e0;margin:3px 0;border-radius:2px}
.stage{padding:1.5rem;overflow:auto;display:flex;justify-content:center}
.paper{width:min(100%,560px);aspect-ratio:8.5/11;background:#fff;color:#111;border-radius:4px;box-shadow:0 6px 24px rgba(17,28,46,.18);padding:12% 10%;position:relative;overflow:hidden;transform-origin:top center}
.paper h2{font-size:1.7rem;font-weight:800;margin-bottom:.4rem;color:#111}
.paper .sub{color:#4B5563;margin-bottom:1rem}
.paper .by{position:absolute;left:10%;bottom:8%;font-size:.8rem;color:#4B5563}

/* role toggle + reviewer dashboard */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}

.hero .seg{max-width:380px}
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1rem;align-items:start}

.insight{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .75rem;border-radius:8px;background:var(--bg);margin-bottom:.5rem}
.insight .ic{margin-top:.15rem;color:var(--c)}
.insight strong{display:block;font-size:.84rem}.insight small{font-size:.76rem}
.insight.warn{--c:var(--amber)}.insight.ok{--c:var(--green)}.insight.info{--c:var(--ai)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.5rem;margin-top:.5rem}
.bdg{margin-left:auto;background:var(--blue);color:#fff;border-radius:99px;font-size:.7rem;font-weight:700;padding:0 .45rem}
.s-changes_requested{--c:var(--blue);--soft:var(--blue-soft)}
.pr-High{--c:var(--red);--soft:var(--red-soft)}.pr-Medium{--c:var(--amber);--soft:var(--amber-soft)}.pr-Low{--c:var(--green);--soft:var(--green-soft)}
.toasts{}
.split{max-width:1050px;margin:0 auto;min-height:calc(100dvh - 3.5rem);padding:2rem 1.25rem;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2.5rem;align-items:center}
.split .left h1{font-size:clamp(2rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-bottom:1rem}

.brand.big{font-size:1.7rem}.brand.big .ic{width:2rem;height:2rem;color:var(--blue)}
.split .art{max-width:380px;margin:0}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.75rem;box-shadow:0 10px 30px rgba(17,28,46,.07)}
.authcard .alt{text-align:center;margin:1.1rem 0 0;font-size:.85rem;color:var(--muted)}
.rowsb{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:-.3rem 0 1rem;font-size:.8rem}
.chk{display:flex;align-items:center;gap:.4rem;font-weight:500}
.splitfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;max-width:1050px;margin:0 auto;padding:.5rem 1.25rem 1.25rem;font-size:.78rem;color:var(--muted)}
@media (max-width:820px){.split{grid-template-columns:1fr;gap:1.5rem}.split .art{margin:0 auto}}
.seg.mini{display:inline-grid;margin:0;padding:3px;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:99px}
.seg.mini button{border:0;background:none;border-radius:99px;padding:.3rem .8rem;font-size:.78rem;color:var(--muted)}
.seg.mini button[aria-pressed=true]{background:var(--primary);color:var(--primary-ink)}
.seg.mini button .ic{width:1em;height:1em}
/* deadlines, versions, steps, analytics */
.dl-pending{--c:var(--blue);--soft:var(--blue-soft)}
.dl-due_soon{--c:var(--amber);--soft:var(--amber-soft)}
.dl-overdue{--c:var(--red);--soft:var(--red-soft)}
.vtag{display:inline-block;font-size:.68rem;font-weight:700;padding:0 .4rem;border-radius:4px;background:var(--ai-soft);color:var(--ai);vertical-align:middle}
.trail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.trail li{padding:.7rem .8rem;border:1px solid var(--line);border-top:3px solid var(--c,var(--line));border-radius:8px;background:var(--bg)}
.trail li[data-s=done]{--c:var(--green)}.trail li[data-s=current]{--c:var(--amber)}.trail li[data-s=rejected]{--c:var(--red)}
.trail strong{display:block}.trail small{font-size:.78rem}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:flex;align-items:center;gap:.75rem;padding:.65rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
.vlist li:first-child{border-top:0}
.vlist .vi{flex:1;min-width:10rem;overflow-wrap:anywhere}.vlist small{display:block}
.waiting{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
/* chat assistant */
#chat{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:15}

.chatbox header{display:flex;align-items:center;justify-content:space-between;padding:.7rem .9rem;background:var(--navy);color:#fff}
.chatbox header strong{display:flex;gap:.45rem;align-items:center}
.chatbox header .iconbtn{color:#fff}.chatbox header .iconbtn:hover{background:var(--navy-2);color:#fff}
.chatlog{flex:1;overflow-y:auto;padding:.8rem;display:flex;flex-direction:column;gap:.55rem;background:var(--bg)}
.msg{max-width:88%;padding:.5rem .75rem;border-radius:12px;line-height:1.45;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--primary);color:var(--primary-ink)}

.msg.err{border-color:var(--red);color:var(--red)}

.chatbox form{display:flex;gap:.5rem;padding:.6rem;border-top:1px solid var(--line)}
.chatbox form input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem;background:var(--surface);color:var(--ink)}
/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:grid;gap:.5rem;z-index:20;width:min(92vw,28rem)}
.toast{background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:8px;font-weight:500}
.toast.error{background:var(--red);color:var(--on-red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="chat"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   CONFIG: the app talks to the Flask backend at API_BASE.
   ========================================================================== */
const CONFIG = { API_BASE: '/api' };

const MAX_BYTES = 10 * 1024 * 1024;
const DOC_TYPES = ['Project Proposal', 'Application Form', 'Report', 'Invoice', 'Certificate', 'Other'];
const STATUS = { draft: 'Draft', submitted: 'Submitted', approved: 'Approved', rejected: 'Rejected', changes_requested: 'Changes requested' };
const EVENT_BY = { draft: 'Created as draft by', submitted: 'Submitted by', approved: 'Approved by', rejected: 'Rejected by', changes_requested: 'Changes requested by' };

const ICONS = {
  dash: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  docs: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  upload: '<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/>',
  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>',
  bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  back: '<path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 9a4.5 4.5 0 0 1 0 9z"/><path d="M12 12v6M9.5 14.5L12 12l2.5 2.5"/>',
  sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  download: '<path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  warn: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.5"/>',
  send: '<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ==========================================================================
   REAL API (Flask)
   ========================================================================== */
const JSON_HEADERS = { 'Content-Type': 'application/json' };
async function http(path, opts = {}) {
  const res = await fetch(CONFIG.API_BASE + path, { credentials: 'include', ...opts });
  if (!res.ok) {
    let msg = 'Something went wrong. Try again.';
    try { msg = (await res.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
const fileUrl = (id, inline) => CONFIG.API_BASE + '/documents/' + id + '/download' + (inline ? '?inline=1' : '');
const mimeOf = name => ({ pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg' }[(name.split('.').pop() || '').toLowerCase()] || null);
const realApi = {
  me: () => http('/auth/me').catch(() => null),
  register: b => http('/auth/register', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(b) }),
  login: b => http('/auth/login', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(b) }),
  logout: () => http('/auth/logout', { method: 'POST' }),
  list: () => http('/documents'),
  get: id => http('/documents/' + id),
  create: fd => http('/documents', { method: 'POST', body: fd }),
  submit: (id, fd) => http('/documents/' + id + '/submit', fd ? { method: 'POST', body: fd } : { method: 'POST' }),
  dash: () => http('/dashboard'),
  analytics: () => http('/analytics'),
  meta: () => http('/meta'),
  review: (id, b) => http('/documents/' + id + '/review', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify(b) }),
  history: () => http('/documents/history'),
    aiReview: id => http('/documents/' + id + '/ai-review'),
  fileInfo: async d => ({ url: fileUrl(d.id, true), mime: mimeOf(d.file_name), name: d.file_name }),
  openFile: async (id, download) => { if (download) window.location.href = fileUrl(id, false); else window.open(fileUrl(id, true), '_blank'); }
};

const api = realApi;

/* ==========================================================================
   UI helpers
   ========================================================================== */
const S = { role: 'user', pending: 0, user: null, view: 'landing', docId: null, backTo: 'dashboard', filter: 'all', q: '', tab: 'ai', ai: true, zoom: 100, page: 1 };
const app = document.getElementById('app');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fmtTime = iso => new Date(iso).toLocaleString(undefined, { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const chip = s => `<span class="chip s-${s}">${STATUS[s]}</span>`;
const isRev = () => S.user.role === 'reviewer';
const canOpenDoc = d => isRev() ? d.status !== 'draft' : (d.owner_id === S.user.id && d.status === 'approved');
const extOf = n => (n.split('.').pop() || '').toUpperCase();
const roleToggle = (cls = '') => `<div class="seg ${cls}" role="group" aria-label="Continue as">${[['user', 'Submitter', 'user'], ['reviewer', 'Admin / Reviewer', 'shield']].map(([r, l, ic]) => `<button type="button" data-act="role" data-r="${r}" aria-pressed="${S.role === r}">${icon(ic)} ${l}</button>`).join('')}</div>`;
const BRAND = `<span class="brand">${icon('sparkle')}<span>DocFlow</span></span>`;

const DEF_META = { levels: ['Reviewer 1', 'Reviewer 2', 'Final Approval'], departments: ['General', 'Finance', 'HR', 'Operations', 'IT', 'Legal', 'Marketing'] };
const meta = () => S.meta || DEF_META;
const DL = { pending: 'Pending', due_soon: 'Due Soon', overdue: 'Overdue' };
const dlChip = d => d.deadline_status ? `<span class="chip dl-${d.deadline_status}">${DL[d.deadline_status]}</span>` : '';
const dlBadge = d => {
  if (!d.deadline_status) return d.deadline ? `<span class="muted">${fmtDate(d.deadline)}</span>` : '<span class="muted">-</span>';
  const n = d.days_left, left = n == null ? '' : n < 0 ? Math.abs(n) + (Math.abs(n) === 1 ? ' day late' : ' days late') : n === 0 ? 'due today' : n + (n === 1 ? ' day left' : ' days left');
  return `${dlChip(d)}<small>${d.deadline ? fmtDate(d.deadline) : 'No deadline'}${left ? ', ' + left : ''}</small>`;
};
const vtag = d => `<span class="vtag">${esc(d.version || 'V1')}</span>`;
function dlCards(x) {
  if (!x) return '';
  const a = x.awaiting_you || { pending: 0 };
  const st = (cls, ic, l, v) => `<div class="stat ${cls}"><span class="ico">${icon(ic)}</span><div><small>${l}</small><b>${v}</b></div></div>`;
  return `<div class="card waiting">${icon('bell')}<span><strong>${a.pending}</strong> ${a.pending === 1 ? 'document is' : 'documents are'} waiting for you${a.level_name ? ' (' + esc(a.level_name) + ')' : ''}</span></div>
    <div class="stats">${st('blue', 'clock', 'Pending', x.pending)}${st('amber', 'bolt', 'Due Soon', x.due_soon)}${st('red', 'warn', 'Overdue', x.overdue)}</div>`;
}
function deptDeadlineFields() {
  const t = new Date(), m = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  return `<div class="f2"><label class="f">Department<select name="department">${meta().departments.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
    <label class="f">Deadline<input type="date" name="deadline" min="${m}"><span class="hint">Optional. Reviewers see it as Pending, Due Soon or Overdue.</span></label></div>`;
}
const levelField = () => `<label class="f">Approval level<select name="approval_level">${meta().levels.map((l, i) => `<option value="${i + 1}">${esc(l)}</option>`).join('')}</select></label>`;
const reviseFields = () => `<div style="flex:1;min-width:16rem"><label class="f">Upload revised file (optional)<input type="file" id="revfile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"><span class="hint">Leave empty to resubmit the same file as the next version.</span></label>
  <label class="f" style="margin:0">What changed<input id="revnote" maxlength="300" placeholder="e.g. Fixed the budget table"></label></div>`;
function stepsCard(d) {
  const w = d.workflow || { steps: [] };
  const items = w.steps.map(s => {
    const txt = s.state === 'done' ? 'Approved' + (s.by ? ' by ' + esc(s.by) : '') + (s.at ? ', ' + fmtDate(s.at) : '')
      : s.state === 'rejected' ? 'Rejected' + (s.by ? ' by ' + esc(s.by) : '')
      : s.state === 'current' ? 'Needs action: ' + (w.awaiting_reviewers && w.awaiting_reviewers.length ? esc(w.awaiting_reviewers.join(', ')) : 'no reviewer assigned yet') : 'Not started';
    return `<li data-s="${s.state}"><strong>${esc(s.name)}</strong><small>${txt}</small></li>`;
  }).join('');
  const note = d.status === 'changes_requested' ? 'Changes were requested. Resubmitting starts again at the first level.' : d.status === 'approved' ? 'All levels have approved this document.' : '';
  return `<div class="card"><h2 style="margin-bottom:.7rem">Approval steps</h2><ol class="trail">${items}</ol>${note ? `<p class="muted" style="margin:.7rem 0 0;font-size:.82rem">${note}</p>` : ''}</div>`;
}
function versionsCard(d) {
  const vs = (d.versions || []).slice().sort((a, b) => b.version_no - a.version_no);
  return `<div class="card"><h2 style="margin-bottom:.4rem">Versions</h2><ul class="vlist">${vs.map(v => `<li><span class="vtag">${esc(v.version)}</span>
    <div class="vi"><strong>${esc(v.file_name)}</strong>${v.is_current ? ' <span class="chip s-approved">Current</span>' : ''}
    <small>${fmtDate(v.created_at)}, ${esc(v.by_name)}, ${fmtSize(v.file_size)}${v.note ? ' | ' + esc(v.note) : ''}</small></div>
    <button class="btn sm" data-act="dlver" data-v="${v.version_no}" ${!isRev() && v.is_current && d.status !== 'approved' ? 'disabled' : ''}>${icon('download')} Download</button></li>`).join('')}</ul></div>`;
}
const fmtHrs = h => h == null ? '-' : h < 48 ? h + ' hrs' : (h / 24).toFixed(1) + ' days';
async function analyticsView(main) {
  const a = await api.analytics(), o = a.overall;
  const st = (cls, ic, l, v) => `<div class="stat ${cls}"><span class="ico">${icon(ic)}</span><div><small>${l}</small><b>${v}</b></div></div>`;
  main.innerHTML = `<div class="pagehead"><div><h1 tabindex="-1">Analytics</h1><p>How fast documents move and where they end up.</p></div></div>
    <div class="stats">${st('blue', 'clock', 'Avg approval time', fmtHrs(o.avg_approval_hours))}${st('green', 'check', 'Approved', o.approved)}${st('red', 'x', 'Rejected', o.rejected)}${st('amber', 'bolt', 'Pending', o.pending)}</div>
    <div class="sechead"><h2>By department</h2></div>
    ${a.by_department.length ? `<div class="tablewrap"><table><thead><tr><th>Department</th><th class="r">Total</th><th class="r">Approved</th><th class="r">Rejected</th><th class="r">Pending</th><th class="r">Avg approval time</th></tr></thead><tbody>${a.by_department.map(r => `<tr><td>${esc(r.department)}</td><td class="r">${r.total}</td><td class="r">${r.approved}</td><td class="r">${r.rejected}</td><td class="r">${r.pending}</td><td class="r">${fmtHrs(r.avg_approval_hours)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty"><h2>No data yet</h2><p>Department figures appear once documents are submitted.</p></div>'}`;
}

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}
async function run(btn, label, fn) {
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = label;
  try { return await fn(); }
  catch (e) { toast(e.message, 'error'); }
  finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}
function go(view, id) {
  S.view = view; S.docId = id == null ? null : id;
  render().then(() => window.scrollTo(0, 0));
}
const home = () => 'dashboard';

/* ==========================================================================
   Logged-out pages
   ========================================================================== */
function landingView() {
  const art = `<div class="art"><svg viewBox="0 0 440 380" role="img" aria-label="Documents protected by a shield with a check mark">
    <ellipse cx="230" cy="215" rx="200" ry="150" fill="var(--warm)" opacity=".9"/>
    <g transform="rotate(-8 150 170)"><rect x="70" y="60" width="170" height="220" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/></g>
    <rect x="120" y="45" width="190" height="240" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
    <rect x="145" y="75" width="60" height="9" rx="4" fill="var(--muted)" opacity=".55"/>
    <rect x="145" y="102" width="140" height="8" rx="4" fill="var(--line)"/><rect x="145" y="122" width="140" height="8" rx="4" fill="var(--line)"/>

async function saveDoc(form, submitAfter, btn) {
  const err = $('#newerr'), el = form.elements;
  const show = m => { err.textContent = m; err.hidden = !m; return false; };
  const title = el.title.value.trim(), description = el.description.value.trim(), file = el.file.files[0];
  if (!title) return show('Add a document title.');
  if (!description) return show('Add a short description.');
  if (!file) return show('Choose a file to upload.');
  if (!/\.(pdf|docx?|png|jpe?g)$/i.test(file.name)) return show('Upload a PDF, Word document or image.');
  if (file.size > MAX_BYTES) return show('The file is larger than 10 MB.');
  if (el.deadline.value && new Date(el.deadline.value + 'T23:59:59') < new Date()) return show('The deadline must be today or later.');
  show('');
  const fd = new FormData();
  fd.append('title', title); fd.append('description', description); fd.append('doc_type', el.doc_type.value);
  fd.append('ai_review', S.ai ? '1' : '0'); fd.append('department', el.department.value); fd.append('deadline', el.deadline.value); fd.append('file', file);
  await run(btn, submitAfter ? 'Submitting…' : 'Saving…', async () => {
    const doc = await api.create(fd);
    if (submitAfter) await api.submit(doc.id);
    toast(doc.doc_id + (submitAfter ? ' submitted for approval.' : ' saved as a draft.'));
    S.backTo = 'docs'; S.tab = S.ai ? 'ai' : 'history'; go('detail', doc.id);
  });
}

    <text x="40" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${score}%</text></svg>`;
}

  const d = await api.get(S.docId);
  let ai = null;
  if (d.ai_review) { try { ai = await api.aiReview(d.id); } catch (e) { ai = null; } }
  S.dd = { d, ai };
  const rev = isRev(), mine = d.owner_id === S.user.id, canOpen = canOpenDoc(d);
  let bar = '';
  if (mine && (d.status === 'draft' || d.status === 'changes_requested')) {
    bar = `<div class="card actionbar"><div class="row" style="align-items:center;justify-content:space-between">${d.status === 'changes_requested' ? reviseFields() : '<span class="muted">Submitting sends this to the review queue and locks it from changes.</span>'}
      <button class="btn primary" data-act="submitDoc">Submit for approval</button></div></div>`;
  } else if (rev && d.status === 'submitted' && !d.can_act) {
    bar = `<div class="card actionbar"><span class="muted">Waiting for ${esc((d.workflow && d.workflow.awaiting) || 'another level')}. Only that level can decide right now.</span></div>`;
  } else if (rev && d.can_act) {
    bar = `<div class="card actionbar"><label class="f" for="remarks" style="margin-bottom:.6rem">Remarks<textarea id="remarks" rows="2" placeholder="Required when rejecting. Optional when approving."></textarea></label>
      <p class="error" id="rerr" role="alert" hidden></p>
      <div class="row"><button class="btn" data-act="changes">${icon('pen')} Request changes</button><button class="btn green" data-act="approve">${icon('check')} Approve</button><button class="btn red" data-act="reject">${icon('x')} Reject</button></div></div>`;
  }
  main.innerHTML = `<button class="back" data-act="back">${icon('back')} Back</button>
    <div class="card"><div class="dochead"><div class="l"><span class="fileico">${icon('docs')}</span><div style="min-width:0">
      <h1 tabindex="-1">${esc(d.title)}</h1>
      <div class="meta"><span class="docid">${esc(d.doc_id)}</span><span>${esc(d.doc_type)}</span><span class="tag">${esc(extOf(d.file_name))}</span>${vtag(d)}${dlChip(d)}<span>${esc(d.department || "General")}</span>
        <span>Submitted by: ${esc(d.owner_name)}</span><span>${fmtDate(d.submitted_at || d.created_at)}</span><span>${fmtSize(d.file_size)}</span></div></div></div>
      <div class="r">${chip(d.status)}
        <button class="btn primary sm" data-act="viewer" ${canOpen ? '' : 'disabled'}>${icon('eye')} View document</button>
        <button class="btn sm" data-act="download" ${canOpen ? '' : 'disabled'}>${icon('download')} Download</button></div></div>
      ${!canOpen && !rev ? '<p class="muted" style="margin:.8rem 0 0;font-size:.82rem">You can view or download this file once a reviewer approves it.</p>' : ''}</div>
    ${stepsCard(d)}${versionsCard(d)}
    <div class="tabs2" role="tablist">${[['ai', 'AI Pre-Review'], ['comments', 'Comments'], ['history', 'History']].map(([k, l]) => `<button class="tab2" role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}</button>`).join('')}</div>
    <div id="panel"></div>${bar}`;
  drawPanel();
}
async function decide(btn, decision) {
  const remarks = $('#remarks').value.trim(), err = $('#rerr');
  if (decision !== 'approved' && !remarks) { err.textContent = 'Add remarks so the owner knows what to fix.'; err.hidden = false; return; }
  err.hidden = true;
  await run(btn, decision === 'approved' ? 'Approving…' : decision === 'rejected' ? 'Rejecting…' : 'Sending…', async () => {
    const d = await api.review(S.docId, { decision, remarks });
    toast(d.doc_id + ({ approved: ' approved.', rejected: ' rejected.', changes_requested: ' sent back for changes.' }[decision]));
    S.tab = 'history'; render();
  });
}

/* ==========================================================================
   Viewer
   ========================================================================== */
function paperPage(d, n) {
  if (n === 1) return `<h2>${esc(d.title)}</h2><div class="sub">${esc(d.doc_type)}</div><div class="ln"></div><div class="ln" style="width:80%"></div>
    <svg viewBox="0 0 400 120" aria-hidden="true"><path d="M0 70 C80 10 160 110 250 50 S360 30 400 60 V120 H0z" fill="#9db4d8"/><path d="M0 90 C90 40 170 120 260 80 S370 60 400 85 V120 H0z" fill="#c4d3ea"/></svg>
    <div class="by">Submitted by<b>${esc(d.owner_name)}</b>${fmtDate(d.submitted_at || d.created_at)}</div>`;
  return `<h2 style="font-size:1.1rem">Page ${n}</h2>${'<div class="ln"></div>'.repeat(9)}`;
}
async function viewerView(main) {
  const d = await api.get(S.docId);
  if (!canOpenDoc(d)) {
    main.innerHTML = `<button class="back" data-act="backdetail">${icon('back')} Back</button><div class="empty"><h2>This file isn't available yet</h2><p>You can open it once a reviewer approves the document.</p></div>`;
    return;
  }
  S.dd = { d, ai: null }; S.zoom = 100; S.page = 1;
  const info = await api.fileInfo(d);
  const isImg = info.mime && info.mime.startsWith('image/'), isPdf = info.mime === 'application/pdf';
  let body, solo = true, tools = '';
  if (info.url && isImg) body = `<img src="${esc(info.url)}" alt="${esc(d.title)}">`;
  else if (info.url && isPdf) body = `<object data="${esc(info.url)}" type="application/pdf" aria-label="${esc(d.title)}"><p>Your browser can't show this PDF inline. Use Download instead.</p></object>`;
  else if (info.url) body = `<div class="empty" style="width:100%"><h2>No inline preview for this file type</h2><p>Download the file to open it.</p></div>`;
  else {
    solo = false;
    tools = `<span id="pg">Page 1 / 3</span><button data-act="zoom" data-d="-10" aria-label="Zoom out">-</button><span id="zm">100%</span><button data-act="zoom" data-d="10" aria-label="Zoom in">+</button>`;
    body = null;
  }
  main.innerHTML = `<button class="back" data-act="backdetail">${icon('back')} Back</button>
    <div class="pagehead"><div><h1 tabindex="-1">Document viewer</h1><p>${esc(d.doc_id)}</p></div></div>
    <div class="vbar"><span class="name">${esc(info.name)}</span>${tools}<button data-act="download">Download</button></div>
    <div class="vbody ${solo ? 'solo' : ''}">${solo ? `<div class="stage">${body}</div>` : `
      <div class="thumbs">${[1, 2, 3].map(n => `<button class="thumb" data-act="page" data-n="${n}" aria-label="Page ${n}" ${n === 1 ? 'aria-current="true"' : ''}><b>${n === 1 ? esc(d.title.slice(0, 14)) : 'Page ' + n}</b><i></i><i></i><i></i></button>`).join('')}</div>
      <div class="stage"><div class="paper" id="paper">${paperPage(d, 1)}</div></div>`}</div>
    ${solo ? '' : '<p class="foot-note">Demo preview. Uploaded files you add in this session open in full.</p>'}`;
}

/* ==========================================================================
   History (grouped by document) + profile
   ========================================================================== */
async function historyView(main) {
  const ev = await api.history();
  const groups = [];
  ev.forEach(e => { let g = groups.find(x => x.pk === e.doc_pk); if (!g) { g = { pk: e.doc_pk, doc_id: e.doc_id, title: e.title, events: [] }; groups.push(g); } g.events.unshift(e); });
  main.innerHTML = `<div class="pagehead"><div><h1 tabindex="-1">Document history</h1><p>View the complete history of your documents.</p></div></div>` +
    (groups.length ? groups.map(g => `<div class="card hist-card"><div class="top"><div class="l"><span class="fileico">${icon('docs')}</span><div><strong class="docid">${esc(g.doc_id)}</strong><div class="muted">${esc(g.title)}</div></div></div>
      <button class="btn sm" data-act="row" data-id="${g.pk}">View document</button></div>
      <ol class="timeline">${g.events.map(h => `<li data-s="${h.to}"><strong>${EVENT_BY[h.to]} ${esc(h.by_name)}</strong><small>${fmtTime(h.at)}</small>
        <div style="margin-top:.3rem">${chip(h.to)}</div>${h.remarks ? `<p><span class="muted">Remarks:</span> ${esc(h.remarks)}</p>` : ''}</li>`).join('')}</ol></div>`).join('')
    : `<div class="empty"><h2>No activity yet</h2><p>Upload a document and its status changes will be listed here.</p><button class="btn primary" data-act="nav" data-view="new">Upload document</button></div>`);
}
function profileView(main) {
  const u = S.user;
  main.innerHTML = `<div class="pagehead"><div><h1 tabindex="-1">Profile</h1><p>Your account details.</p></div></div>
    <div class="card" style="max-width:520px"><div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem"><span class="av sm" style="width:52px;height:52px;font-size:1.2rem">${esc(u.name[0].toUpperCase())}</span>
      <div><h2>${esc(u.name)}</h2><small>${isRev() ? 'Reviewer' : 'User'}</small></div></div>
      <dl class="kv"><dt>Email</dt><dd>${esc(u.email)}</dd><dt>Role</dt><dd>${isRev() ? 'Reviewer / admin' : 'Submitter'}</dd></dl>
      <div style="margin-top:1.25rem"><button class="btn" data-act="signout">${icon('logout')} Logout</button></div></div>`;
}

/* ==========================================================================
   Auth actions
   ========================================================================== */
async function signIn(fn, btn) {
  const err = $('#autherr');
  try {
    if (btn) btn.disabled = true;
    S.user = await fn();
    S.filter = 'all'; S.q = ''; S.view = home(); S.docId = null;
    render();
  } catch (e) {
    if (err) { err.textContent = e.message; err.hidden = false; } else toast(e.message, 'error');
    if (btn) btn.disabled = false;
  }
}

/* ==========================================================================
   Events
   ========================================================================== */
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const a = t.dataset.act;
  switch (a) {
    case 'nav': S.filter = t.dataset.view === 'pending' ? 'submitted' : 'all'; go(t.dataset.view); break;
    case 'row': S.backTo = ['history', 'docs', 'pending', 'rhistory'].includes(S.view) ? S.view : 'dashboard'; S.tab = 'ai'; go('detail', Number(t.dataset.id)); break;
    case 'back': go(S.backTo || home()); break;
    case 'backdetail': go('detail', S.docId); break;
    case 'retry': render(); break;
    case 'dlver': window.location.href = CONFIG.API_BASE + '/documents/' + S.docId + '/versions/' + t.dataset.v + '/download'; break;
    case 'filter': S.filter = t.dataset.f; render(); break;
    case 'clearq': S.q = ''; render(); break;
    case 'tab': S.tab = t.dataset.tab; drawPanel(); break;
    case 'forgot': toast('Please contact your admin to reset your password.'); break;
    case 'role': S.role = t.dataset.r; render(); break;
    case 'changes': decide(t, 'changes_requested'); break;
    case 'goauth': S.view = t.dataset.v; render().then(() => window.scrollTo(0, 0)); break;
    case 'scroll': { const el = t.dataset.to === 'top' ? document.body : document.getElementById(t.dataset.to); if (el) el.scrollIntoView(); break; }
    case 'eye': { const i = t.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; t.setAttribute('aria-label', i.type === 'password' ? 'Show password' : 'Hide password'); break; }
    case 'signout': api.logout().catch(() => {}).then(() => { S.user = null; S.view = 'landing'; render(); }); break;
    case 'toggleAI': S.ai = !S.ai; t.setAttribute('aria-checked', String(S.ai)); break;
    case 'saveDraft': saveDoc(t.closest('form'), false, t); break;
    case 'submitDoc': run(t, 'Submitting…', async () => { let fd = null; if (S.dd && S.dd.d.status === 'changes_requested') { fd = new FormData(); const rf = $('#revfile'), f = rf && rf.files[0]; if (f) { if (!/\.(pdf|docx?|png|jpe?g)$/i.test(f.name) || f.size > MAX_BYTES) throw new Error('The revised file must be a PDF, Word document or image under 10 MB.'); fd.append('file', f); } const nt = $('#revnote'); if (nt && nt.value.trim()) fd.append('note', nt.value.trim()); } await api.submit(S.docId, fd); toast('Submitted. A reviewer will pick it up.'); S.tab = 'history'; render(); }); break;
    case 'approve': decide(t, 'approved'); break;
    case 'reject': decide(t, 'rejected'); break;
    case 'viewer': go('viewer', S.docId); break;
    case 'download': run(t, 'Preparing…', () => api.openFile(S.docId, true)); break;
    case 'zoom': { S.zoom = Math.min(150, Math.max(60, S.zoom + Number(t.dataset.d))); $('#zm').textContent = S.zoom + '%'; $('#paper').style.transform = `scale(${S.zoom / 100})`; break; }
    case 'page': { S.page = Number(t.dataset.n); $('#paper').innerHTML = paperPage(S.dd.d, S.page); $('#pg').textContent = `Page ${S.page} / 3`; document.querySelectorAll('.thumb').forEach(b => b.removeAttribute('aria-current')); t.setAttribute('aria-current', 'true'); break; }
    case 'bell': api.list().then(rows => {
      const n = rows.filter(d => d.status === 'submitted').length;
      toast(isRev() ? (n ? n + (n === 1 ? ' document is' : ' documents are') + ' waiting for your review.' : 'Nothing is waiting for review.')
        : (n ? 'You have ' + n + (n === 1 ? ' document' : ' documents') + ' pending review.' : 'None of your documents are pending review.'));
    }).catch(err => toast(err.message, 'error')); break;
  }
});
app.addEventListener('change', e => {
  if (e.target.name === 'file') { const f = e.target.files[0]; const el = $('#fname'); if (el) el.textContent = f ? f.name + ' (' + fmtSize(f.size) + ')' : 'PDF, DOC, DOCX, JPG, PNG (max 10 MB)'; }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'searchForm') { S.q = $('#q').value; S.filter = 'all'; go('docs'); return; }
  const btn = f.querySelector('[type=submit]');
  if (f.id === 'authForm') {
    const fd = new FormData(f), login = S.view === 'login';
    const email = (fd.get('email') || '').trim(), password = fd.get('password') || '', name = (fd.get('name') || '').trim();
    const bad = m => { const err = $('#autherr'); err.textContent = m; err.hidden = false; };
    if (!email || !password || (!login && !name)) return bad('Fill in all the fields.');
    if (!login && password !== fd.get('confirm')) return bad('The passwords do not match.');
    const rv = S.role === 'reviewer';
    signIn(() => login ? api.login({ email, password, role: rv ? 'reviewer' : 'submitter' }) : api.register({ name, email, password, role: rv ? 'reviewer' : 'user', access_code: fd.get('access_code') || '', approval_level: fd.get('approval_level') || 1 }), btn);
  } else if (f.id === 'newForm') saveDoc(f, true, btn);
});

/* ==========================================================================
   Chat assistant (calls POST /api/chat, which talks to Groq on the server)
   ========================================================================== */
S.chat = { open: false, busy: false, msgs: [] };
const CHAT_TIPS = ['Why is my document still pending?', 'What does "changes requested" mean?', 'Which documents are overdue?'];
const fmtMsg = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
function chatDraw(focus) {
  const el = $('#chat'); if (!el) return;
  if (!S.user) { S.chat.open = false; S.chat.msgs = []; el.innerHTML = ''; return; }
  if (!S.chat.open) { el.innerHTML = ''; return; }
  const old = el.querySelector('#chatIn'), draft = old ? old.value : '';
  const ctx = S.view === 'detail' && S.dd ? S.dd.d.doc_id : null;
  const log = (S.chat.msgs.length ? '' : `<p class="chatctx">Ask about statuses, deadlines, approval levels, versions or what to do next.</p><div class="tips">${CHAT_TIPS.map(q => `<button type="button" class="fchip" data-chat="tip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`)
    + S.chat.msgs.map(m => `<div class="msg ${m.role}${m.err ? ' err' : ''}">${fmtMsg(m.content)}</div>`).join('')
    + (S.chat.busy ? '<div class="msg assistant">Thinking...</div>' : '');
  el.innerHTML = `<section class="chatbox" role="dialog" aria-label="DocFlow assistant"><header><strong>${icon('sparkle')} DocFlow assistant</strong><button type="button" class="iconbtn" data-chat="close" aria-label="Close assistant">${icon('x')}</button></header>
    <div class="chatlog" id="chatLog" aria-live="polite">${ctx ? `<p class="chatctx">Asking about ${esc(ctx)}</p>` : ''}${log}</div>
    <form id="chatForm"><label class="sr" for="chatIn">Your question</label><input id="chatIn" maxlength="1000" placeholder="Ask about a document..." autocomplete="off" value="${esc(draft)}">
    <button class="btn primary sm" ${S.chat.busy ? 'disabled' : ''}>${icon('send')}<span class="sr">Send</span></button></form></section>`;
  const lg = $('#chatLog'); lg.scrollTop = lg.scrollHeight;
  if (focus) $('#chatIn').focus();
}
async function chatSend(text) {
  text = text.trim(); if (!text || S.chat.busy) return;
  const hist = S.chat.msgs.filter(m => !m.err).slice(-8).map(m => ({ role: m.role, content: m.content }));
  S.chat.msgs.push({ role: 'user', content: text }); S.chat.busy = true; chatDraw();
  try {
    const r = await http('/chat', { method: 'POST', headers: JSON_HEADERS, body: JSON.stringify({ message: text, history: hist, doc_id: S.view === 'detail' ? S.docId : null }) });
    S.chat.msgs.push({ role: 'assistant', content: r.reply });
  } catch (e) { S.chat.msgs.push({ role: 'assistant', content: e.message, err: true }); }
  S.chat.busy = false; chatDraw(true);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-chat]'); if (!t) return;
  const a = t.dataset.chat;
  if (a === 'open') { S.chat.open = !S.chat.open; chatDraw(true); }
  else if (a === 'close') { S.chat.open = false; chatDraw(); }
  else if (a === 'tip') chatSend(t.dataset.q);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.chat.open) { S.chat.open = false; chatDraw(); } });
$('#chat').addEventListener('submit', e => {
  e.preventDefault();
  const i = $('#chatIn'), v = i.value; i.value = '';
  chatSend(v);
});

(async function init() {
  S.meta = await api.meta().catch(() => null);
  try { S.user = await api.me(); } catch (e) { S.user = null; }
  S.view = S.user ? home() : 'landing';
  render();
})();
</script>
